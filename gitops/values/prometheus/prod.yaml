crds:
  enabled: true

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 30d
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
