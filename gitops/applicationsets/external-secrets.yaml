apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: dev
            cluster: in-cluster
          # Exemplos para clusters futuros. Descomente quando eles forem
          # registrados no Argo CD.
          # - environment: uat
          #   cluster: eks-uat
          # - environment: prod
          #   cluster: eks-prod
  template:
    metadata:
      name: external-secrets-{{environment}}
      labels:
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: external-secrets
        environment: '{{environment}}'
    spec:
      project: default
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.8.0
        helm:
          releaseName: external-secrets
          values: |
            installCRDs: true
            replicaCount: 2
      destination:
        name: '{{cluster}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
