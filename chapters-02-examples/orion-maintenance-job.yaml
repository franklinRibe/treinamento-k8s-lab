apiVersion: batch/v1
kind: Job
metadata:
  name: orion-maintenance
  namespace: chapter-02-lab
  labels:
    app.kubernetes.io/name: orion-maintenance
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-maintenance
        app.kubernetes.io/part-of: orion
    spec:
      restartPolicy: Never
      containers:
        - name: maintenance
          image: orion-api:chapter-02
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -B
            - -c
            - |
              print("orion maintenance completed", flush=True)
