apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: orion-node-observer
  namespace: chapter-02-lab
  labels:
    app.kubernetes.io/name: orion-node-observer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-node-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-node-observer
        app.kubernetes.io/part-of: orion
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: observer
          image: orion-api:chapter-02
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -B
            - -c
            - |
              import os
              import time
              print("orion-node-observer node=" + os.environ["NODE_NAME"], flush=True)
              while True:
                  time.sleep(30)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
