apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-api
  namespace: chapter-02-lab
  labels:
    app.kubernetes.io/name: orion-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-api
        app.kubernetes.io/part-of: orion
    spec:
      serviceAccountName: orion-api
      containers:
        - name: api
          image: orion-api:chapter-02
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
