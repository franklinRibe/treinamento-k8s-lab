apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-api
  namespace: chapter-02-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-runtime-settings
  namespace: chapter-02-lab
data:
  log-level: info
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orion-runtime-settings-reader
  namespace: chapter-02-lab
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - orion-runtime-settings
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orion-api-reads-runtime-settings
  namespace: chapter-02-lab
subjects:
  - kind: ServiceAccount
    name: orion-api
    namespace: chapter-02-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orion-runtime-settings-reader
