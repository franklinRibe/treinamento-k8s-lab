apiVersion: batch/v1
kind: Job
metadata:
  name: orion-maintenance-retry-demo
  namespace: chapter-02-lab
  labels:
    app.kubernetes.io/name: orion-maintenance-retry-demo
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-maintenance-retry-demo
        app.kubernetes.io/part-of: orion
    spec:
      restartPolicy: Never
      containers:
        - name: maintenance
          image: orion-api:chapter-02
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -B
            - -c
            - |
              print("orion maintenance attempt failed", flush=True)
              raise SystemExit(17)
