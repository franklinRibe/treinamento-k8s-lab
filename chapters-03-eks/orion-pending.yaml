apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-pending
  namespace: orion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-pending
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-pending
    spec:
      nodeSelector:
        lab.eks.example/absent: "true"
      containers:
        - name: api
          image: orion-api:lab
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
