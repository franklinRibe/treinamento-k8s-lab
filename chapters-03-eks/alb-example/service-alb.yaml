apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test-3
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-test-3

  template:
    metadata:
      labels:
        app: nginx-test-3
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test-3
  namespace: default
spec:
  type: ClusterIP

  selector:
    app: nginx-test-3

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-test-3
  namespace: default

  annotations:
    alb.ingress.kubernetes.io/group.name: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

spec:
  ingressClassName: alb

  rules:
    - host: nginx.darede.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-test-3
                port:
                  number: 80