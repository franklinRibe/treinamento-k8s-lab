# Orion defeituosa — não corrigir antes de coletar evidências
apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-api-settings
  namespace: orion
data:
  ORION_ENV: laboratorio
---
apiVersion: v1
kind: Secret
metadata:
  name: orion-api-secret
  namespace: orion
type: Opaque
stringData:
  API_TOKEN: laboratorio-descartavel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-api
  namespace: orion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: orion-api:lab
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ORION_ENV
              valueFrom:
                configMapKeyRef:
                  name: orion-api-config
                  key: ORION_ENV
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orion-api-secret
                  key: API_TOKEN
          readinessProbe:
            httpGet:
              path: /ready-incorreto
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-api
  namespace: orion
spec:
  selector:
    app.kubernetes.io/name: orion
  ports:
    - name: http
      port: 80
      targetPort: http
