apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orion-default-deny
  namespace: orion
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orion-allow-dns-and-same-namespace
  namespace: orion
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orion-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
