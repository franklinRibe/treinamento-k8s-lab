apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-eso
  namespace: orion
  annotations:
    # Substitua pelo ARN real da role dedicada ao ESO antes de aplicar em EKS.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/orion-eso-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: orion-aws-secrets
  namespace: orion
spec:
  provider:
    aws:
      service: SecretsManager
      region: sa-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: orion-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orion-api
  namespace: orion
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: orion-aws-secrets
    kind: SecretStore
  target:
    name: orion-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: orion/prod/api
        property: username
    - secretKey: password
      remoteRef:
        key: orion/prod/api
        property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-from-external-secret
  namespace: orion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-from-external-secret
  template:
    metadata:
      labels:
        app: orion-from-external-secret
    spec:
      serviceAccountName: default
      containers:
        - name: api
          image: orion-api:lab
          env:
            - name: ORION_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orion-api-credentials
                  key: username
            - name: ORION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orion-api-credentials
                  key: password
