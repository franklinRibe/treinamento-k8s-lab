apiVersion: v1
kind: Namespace
metadata:
  name: orion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-demo
  namespace: orion
  labels:
    app.kubernetes.io/name: metrics-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-demo
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - name: web
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: web
          livenessProbe:
            httpGet:
              path: /metrics
              port: web
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-demo
  namespace: orion
  labels:
    app.kubernetes.io/name: metrics-demo
spec:
  selector:
    app.kubernetes.io/name: metrics-demo
  ports:
    - name: web
      port: 8080
      targetPort: web
